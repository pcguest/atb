[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"  # ✅ Modern standard backend

[project]
name = "atb-sdk"
version = "0.1.0"
description = "ATB (Agent Trace Bundle) Python SDK — tamper-evident audit trails for AI agent workflows"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Manus", email = "dev@atb.dev" }]
keywords = ["audit", "ai", "agents", "tracing", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
langchain = ["langchain>=0.1.0"]
llamaindex = ["llama-index>=0.10.0"]
dev = ["pytest>=7.0", "black", "mypy", "ruff"]

[project.urls]
Homepage = "https://atb.dev"
Repository = "https://github.com/pcguest/atb"
Documentation = "https://atb.dev/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["atb*"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.9"
strict = true
