[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"  # ✅ Modern standard backend

[project]
name = "atb-sdk"
version = "1.1.0"
description = "ATB (Agent Trace Bundle) Python SDK - tamper-evident audit trails for AI agent workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paddy Guest", email = "patrickcguest@proton.me" }]
keywords = ["audit", "ai", "agents", "tracing", "observability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "cryptography>=42.0.0",
]

[project.scripts]
atb = "atb.cli:main"

[project.optional-dependencies]
langchain = ["langchain>=0.1.0", "langchain-core>=0.2.0"]
llamaindex = ["llama-index>=0.10.0"]
dev = ["pytest>=7.0", "black", "mypy", "ruff"]

[project.urls]
Homepage = "https://github.com/pcguest/atb"
Repository = "https://github.com/pcguest/atb"
Documentation = "https://github.com/pcguest/atb/blob/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["atb*", "cmd*"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.9"
strict = true
