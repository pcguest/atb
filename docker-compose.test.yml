services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      CI: "true"
      DISPLAY: ":99"
      CYPRESS_BASE_URL: "http://localhost:18888"
      CYPRESS_baseUrl: "http://localhost:18888"
      CYPRESS_BROWSER: "chromium"
      CHROME_BIN: "/usr/bin/chromium"
      PATH: "/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - .:/app
      - /app/web/node_modules
    working_dir: /app
    shm_size: 2gb
    cap_add:
      - SYS_ADMIN
    entrypoint:
      - /bin/bash
      - -lc
      - "echo 'Docker test environment ready' && echo 'Run: make test-e2e or make test-all inside container' && tail -f /dev/null"
