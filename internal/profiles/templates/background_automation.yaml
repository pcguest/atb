id: atb.profile.background_automation
version: 1
workflow_class: background_automation
blind_spots:
  - Scheduling system integrity is not attested; a compromised scheduler could trigger executions without a corresponding schedule record.
  - Does not verify that the automated job's real-world effect matches the recorded completion outcome or result digest.
weights:
  EC: 0.20
  FC: 0.15
  RC: 0.20
  TC: 0.10
  SC: 0.10
  XC: 0.05
  AC: 0.05
  GC: 0.15
required:
  - type: atb.bundle.manifest
    fields: []
    message: atb.bundle.manifest missing
    severity: critical
  - type: ai.request.received
    fields:
      - request_id
      - actor_id_hash
      - purpose_tag
    message: ai.request.received missing required fields
    severity: critical
  - type: ai.job.scheduled
    fields:
      - job_id
      - schedule_id
      - job_type
      - trigger_type
    message: ai.job.scheduled missing required fields
    severity: critical
  - type: ai.job.started
    fields:
      - job_id
      - worker_id
      - start_reason
    message: ai.job.started missing required fields
    severity: critical
  - type: ai.job.step
    fields:
      - job_id
      - step_id
      - step_name
      - step_outcome
    message: ai.job.step missing required fields
    severity: critical
  - type: ai.job.completed
    fields:
      - job_id
      - completion_outcome
      - result_digest
    message: ai.job.completed missing required fields
    severity: critical
optional: []
relations:
  - name: start_requires_schedule
    from: ai.job.started
    to: ai.job.scheduled
    field: job_id
    message: "start_requires_schedule: ai.job.started job_id does not match ai.job.scheduled"
  - name: step_requires_start
    from: ai.job.step
    to: ai.job.started
    field: job_id
    message: "step_requires_start: ai.job.step job_id does not match ai.job.started"
  - name: completion_requires_start
    from: ai.job.completed
    to: ai.job.started
    field: job_id
    message: "completion_requires_start: ai.job.completed job_id does not match ai.job.started"
