id: atb.profile.background_automation
version: 1
workflow_class: background_automation
blind_spots:
  - Scheduling system integrity is not attested; a compromised scheduler could trigger executions without a corresponding schedule record.
  - Does not verify that the automated job's real-world effect matches the recorded completion outcome or result digest.
  - Policy authorisation is not required by this profile; append ai.policy.decision separately if the workflow requires it.
weights:
  EC: 0.15
  FC: 0.10
  RC: 0.15
  TC: 0.10
  SC: 0.05
  XC: 0.20
  AC: 0.05
  GC: 0.20
supports_cas: true
required:
  - type: atb.bundle.manifest
    fields: []
    message: atb.bundle.manifest missing
    severity: critical
  - type: ai.job.scheduled
    fields:
      - job_id
      - job_type
      - trigger_source
      - scheduled_by_id_hash
    message: ai.job.scheduled missing required fields
    severity: critical
  - type: ai.job.started
    fields:
      - job_id
      - worker_id_hash
      - started_at
    message: ai.job.started missing required fields
    severity: critical
  - type: ai.job.completed
    fields:
      - job_id
      - outcome
      - completion_reason
    message: ai.job.completed missing required fields
    severity: critical
optional:
  - type: ai.job.step
    fields:
      - job_id
      - step_index
      - step_type
      - step_outcome
    message: ai.job.step missing required fields
    severity: warning
relations:
  - name: job_started_requires_scheduled
    from: ai.job.started
    to: ai.job.scheduled
    field: job_id
    message: "job_started_requires_scheduled: ai.job.started job_id does not match ai.job.scheduled"
  - name: job_completed_requires_started
    from: ai.job.completed
    to: ai.job.started
    field: job_id
    message: "job_completed_requires_started: ai.job.completed job_id does not match ai.job.started"
