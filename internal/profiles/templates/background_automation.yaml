id: atb.profile.background_automation
version: 1
workflow_class: background_automation
blind_spots:
  - "Limitation: scheduler integrity is not attested. | Mitigation: corroboration from scheduler queue (L4). | Residual: compromised scheduler without external witness."
  - "Limitation: real-world job effect vs recorded outcome. | Mitigation: result_set_digest and tool receipts (L2/L3). | Residual: uninstrumented side effects."
  - "Limitation: policy authorisation not required by this profile. | Mitigation: append ai.policy.decision when required (L2). | Residual: unattended jobs without policy events."
  - "Limitation: XC credit requires corroboration events. | Mitigation: atb corroborate (L4). | Residual: adapter not used."
weights:
  EC: 0.15
  FC: 0.10
  RC: 0.15
  TC: 0.10
  SC: 0.05
  XC: 0.20
  AC: 0.05
  GC: 0.20
supports_cas: true
required:
  - type: atb.bundle.manifest
    fields: []
    message: atb.bundle.manifest missing
    severity: critical
  - type: ai.job.scheduled
    fields:
      - job_id
      - job_type
      - trigger_source
      - scheduled_by_id_hash
    message: ai.job.scheduled missing required fields
    severity: critical
  - type: ai.job.started
    fields:
      - job_id
      - worker_id_hash
      - started_at
    message: ai.job.started missing required fields
    severity: critical
  - type: ai.job.completed
    fields:
      - job_id
      - outcome
      - completion_reason
    message: ai.job.completed missing required fields
    severity: critical
optional:
  - type: ai.job.step
    fields:
      - job_id
      - step_index
      - step_type
      - step_outcome
    message: ai.job.step missing required fields
    severity: warning
relations:
  - name: job_started_requires_scheduled
    from: ai.job.started
    to: ai.job.scheduled
    field: job_id
    message: "job_started_requires_scheduled: ai.job.started job_id does not match ai.job.scheduled"
  - name: job_completed_requires_started
    from: ai.job.completed
    to: ai.job.started
    field: job_id
    message: "job_completed_requires_started: ai.job.completed job_id does not match ai.job.started"
