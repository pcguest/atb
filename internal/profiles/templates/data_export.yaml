id: atb.profile.data_export
version: 1
workflow_class: data_export
blind_spots:
  - Does not verify downstream data handling or recipient controls after export is committed.
  - Classification labels on exported records are presence-checked only; correctness of labelling is not attested.
  - XC credit requires at least one valid atb.corroboration.external event. The absence of corroboration events does not indicate a recording failure — it indicates the corroboration adapter was not used.
weights:
  EC: 0.15
  FC: 0.10
  RC: 0.15
  TC: 0.10
  SC: 0.10
  XC: 0.20
  AC: 0.10
  GC: 0.10
supports_cas: true
sc_mode: policy_decision
required:
  - type: atb.bundle.manifest
    fields: []
    message: atb.bundle.manifest missing
    severity: critical
  - type: ai.request.received
    fields:
      - request_id
      - actor_id_hash
      - purpose_tag
    message: ai.request.received missing required fields
    severity: critical
  - type: ai.policy.decision
    fields:
      - policy_id
      - policy_version
      - decision
      - decision_reason_codes
      - subject_id_hash
      - action_id
    message: ai.policy.decision missing required fields
    severity: critical
  - type: data.export.precommit
    fields:
      - action_id
      - action_type
      - action_parameters_digest
      - target_resource_id
      - intended_effect
    message: data.export.precommit missing required fields
    severity: critical
  - type: data.export.executed
    fields:
      - action_id
      - execution_outcome
      - tool_receipt_digest
    message: data.export.executed missing required fields
    severity: critical
optional:
  - type: ai.human.approval
    fields:
      - approval_id
      - approver_id_hash
      - approval_outcome
      - justification_digest
      - action_id
    message: ai.human.approval required for data export workflows
    severity: warning
    required_when:
      - when_type: data.export.executed
        at_or_after: true
        message: ai.human.approval required when data exports execute
relations:
  - name: policy_binds_action
    from: ai.policy.decision
    to: data.export.precommit
    field: action_id
    message: "policy_binds_action: ai.policy.decision action_id does not match data.export.precommit"
  - name: execution_after_authorization
    from: data.export.executed
    to: ai.policy.decision
    field: action_id
    message: "execution_after_authorization: ai.policy.decision decision is not allow for executed action_id"
    predicates:
      - side: to
        field: decision
        equals: allow
