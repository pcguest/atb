name: Issue and PR Labeling

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-labels:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  issue-triage:
    if: ${{ github.event_name == 'issues' }}
    runs-on: ubuntu-latest
    steps:
      - name: Apply issue labels from template + impact
        id: triage
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || "";
            const body = issue.body || "";
            const labels = new Set(["needs-triage"]);

            if (title.includes("[Bug]")) labels.add("bug");
            if (title.includes("[Feature]")) labels.add("enhancement");
            if (title.includes("[Integration]")) labels.add("integration");

            const impactBlocker = /Impact\s*\n\s*Blocker/i.test(body);
            const impactNice = /Impact\s*\n\s*Nice-to-have/i.test(body);
            const impactQuestion = /Impact\s*\n\s*Question/i.test(body);

            if (impactBlocker) labels.add("impact:blocker");
            if (impactNice) labels.add("impact:nice-to-have");
            if (impactQuestion) labels.add("impact:question");

            const traceAttached = /Trace Bundle Attached\?[\s\S]*?- \[x\]/i.test(body);
            if (traceAttached) labels.add("trace:attached");

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: Array.from(labels),
            });

            core.setOutput("is_blocker", impactBlocker ? "true" : "false");
            core.setOutput("issue_number", String(issue.number));

      - name: Notify Discord for blocker issues
        if: ${{ steps.triage.outputs.is_blocker == 'true' && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ steps.triage.outputs.issue_number }}
        run: |
          payload=$(printf '{"content":"🚨 ATB blocker issue #%s: %s\n%s"}' "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ISSUE_URL")
          curl -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
