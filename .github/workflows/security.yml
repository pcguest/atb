name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # Mondays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Layer D: full-history secret detection. Comments and artifact uploads are
  # disabled so this job only needs read-only repository and PR metadata.
  secret-scan:
    name: Layer D - Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # Layer D: Go static security scan over repository code.
  go-security:
    name: Layer D - Go Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.7"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Build UI Export
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run gosec (HIGH only)
        run: |
          go_bin="$(go env GOPATH)/bin/gosec"
          "$go_bin" -severity high -confidence medium ./...

  # Layer D: Python static security scan over SDK code.
  python-security:
    name: Layer D - Python Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install -r sdk/python/requirements-security.txt

      - name: Run Bandit (HIGH severity/high confidence)
        run: python -m bandit -q -r sdk/python/atb -lll -iii

  # Layer D: Node dependency vulnerability scan over the TypeScript SDK and web UI.
  node-security:
    name: Layer D - Node Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Run npm audit (HIGH/CRITICAL) — TypeScript SDK
        working-directory: sdk/typescript
        run: npm audit --audit-level=high

      - name: Install web UI dependencies
        working-directory: web
        run: npm ci

      - name: Run npm audit (HIGH/CRITICAL) — web UI
        working-directory: web
        run: npm audit --audit-level=high

  # Layer D: scheduled/manual filesystem vulnerability sweep; no Docker image build required.
  trivy-fs:
    name: Layer D - Trivy Filesystem Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  # Layer D: Docker image vulnerability scan using Buildx and Trivy image mode.
  trivy-image:
    name: Layer D - Trivy Docker Image Scan (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Docker image for scan
        env:
          IMAGE_REF: atb:security-scan-${{ matrix.suffix }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(grep -E '^\s+version\s+=' cmd/atb/main.go | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          docker buildx build \
            --build-arg "ATB_VERSION=v${SOURCE_VERSION}" \
            --platform "${PLATFORM}" \
            --load \
            -t "${IMAGE_REF}" \
            .

          bash scripts/verify-container-architecture.sh "${IMAGE_REF}" "${PLATFORM}"

          LABEL_VERSION="$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            "${IMAGE_REF}")"
          BINARY_VERSION="$(docker run --rm --platform "${PLATFORM}" \
            "${IMAGE_REF}" version | awk '{print $NF}')"
          if [ "${LABEL_VERSION}" != "v${SOURCE_VERSION}" ]; then
            echo "OCI version label ${LABEL_VERSION} does not match v${SOURCE_VERSION}" >&2
            exit 1
          fi
          if [ "${BINARY_VERSION}" != "${SOURCE_VERSION}" ]; then
            echo "atb binary version ${BINARY_VERSION} does not match ${SOURCE_VERSION}" >&2
            exit 1
          fi

          CONTAINER_ID="$(docker create --platform "${PLATFORM}" "${IMAGE_REF}")"
          CHECK_DIR="$(mktemp -d)"
          cleanup() {
            docker rm -f "${CONTAINER_ID}" >/dev/null 2>&1 || true
            rm -rf "${CHECK_DIR}"
          }
          trap cleanup EXIT
          docker cp "${CONTAINER_ID}:/licenses/atb/LICENSE" "${CHECK_DIR}/LICENSE"
          docker cp "${CONTAINER_ID}:/licenses/atb/THIRD_PARTY_NOTICES" "${CHECK_DIR}/THIRD_PARTY_NOTICES"
          docker cp "${CONTAINER_ID}:/app/web/out/view/index.html" "${CHECK_DIR}/viewer-index.html"
          test -s "${CHECK_DIR}/LICENSE"
          test -s "${CHECK_DIR}/THIRD_PARTY_NOTICES"
          test -s "${CHECK_DIR}/viewer-index.html"

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: image
          image-ref: atb:security-scan-${{ matrix.suffix }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
