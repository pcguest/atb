name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  go-security:
    name: Go (HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec (HIGH only)
        run: "$(go env GOPATH)/bin/gosec -severity high -confidence medium ./..."

  python-security:
    name: Python (HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Run Bandit (HIGH severity/high confidence)
        run: python -m bandit -q -r sdk/python/atb -lll -iii

  node-security:
    name: Node (HIGH/CRITICAL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TypeScript SDK dependencies
        run: |
          cd sdk/typescript
          npm ci

      - name: Run npm audit (HIGH/CRITICAL)
        run: |
          cd sdk/typescript
          npm audit --audit-level=high

  encrypt-parity:
    name: Verify cross-language encryption parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python SDK dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./sdk/python

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TypeScript SDK dependencies
        run: |
          cd sdk/typescript
          npm ci

      - name: Run parity test
        env:
          ATB_PYTHON_BIN: python
        run: |
          go test ./test/golden/... -run TestEncryptParity_AllSDKs -v
