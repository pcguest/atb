name: Version gate

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    paths:
      - cmd/atb/main.go
      - sdk/python/pyproject.toml
      - sdk/python/atb/__init__.py
      - sdk/typescript/package.json
      - web/package.json

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for git describe --tags

      - name: Check version string agreement
        env:
          # Skip the tag equality check on branch/PR pushes; only enforce it on tag pushes.
          ATB_SKIP_TAG_CHECK: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
        run: bash scripts/check-versions.sh
