name: Repository operations

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check published registries
        run: ./scripts/check-registries.sh

  pr-labels:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # v6.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  issue-triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Apply issue labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || "";
            const body = issue.body || "";
            const labels = new Set(["needs-triage"]);

            if (title.includes("[Bug]")) labels.add("bug");
            if (title.includes("[Feature]")) labels.add("enhancement");
            if (title.includes("[Integration]")) labels.add("integration");
            if (/Impact\s*\n\s*Blocker/i.test(body)) labels.add("impact:blocker");
            if (/Impact\s*\n\s*Nice-to-have/i.test(body)) labels.add("impact:nice-to-have");
            if (/Impact\s*\n\s*Question/i.test(body)) labels.add("impact:question");
            if (/Trace Bundle Attached\?[\s\S]*?- \[x\]/i.test(body)) labels.add("trace:attached");

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: Array.from(labels),
            });
