name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.1"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./sdk/python[dev]

      - name: Validate TypeScript lockfile
        working-directory: sdk/typescript
        run: npm ci --dry-run

      - name: Install TypeScript dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build UI Export
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run export

      - name: Run Go tests
        run: go test ./...

      - name: Run Python tests
        working-directory: sdk/python
        run: pytest -q

      - name: Run TypeScript checks
        working-directory: sdk/typescript
        run: |
          npm run typecheck
          npm run test
          npm run build

      - name: Validate tag version parity
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PY_VERSION="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('sdk/python/pyproject.toml').read_text())['project']['version'])")"
          TS_VERSION="$(node -p "require('./sdk/typescript/package.json').version")"

          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match sdk/python version ($PY_VERSION)."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$TS_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match sdk/typescript version ($TS_VERSION)."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.1"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Build UI Export
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run export

      - name: Build CLI binaries
        run: |
          set -euo pipefail
          mkdir -p dist/release
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-linux-amd64 ./cmd/atb
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-linux-arm64 ./cmd/atb
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-darwin-amd64 ./cmd/atb
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-darwin-arm64 ./cmd/atb
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-windows-amd64.exe ./cmd/atb
          (cd dist/release && sha256sum atb-* > checksums.txt)

      - name: Build Python artifacts
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Build npm artifact
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build
          npm pack --silent

      - name: Build Docker image (smoke)
        run: docker build --platform linux/amd64 -t atb:release-smoke .

      - name: Export Docker smoke image
        run: |
          mkdir -p dist/release
          docker save atb:release-smoke -o dist/release/atb-docker-linux-amd64.tar

      - name: Upload CLI binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-binaries
          path: dist/release/*

      - name: Upload Python dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: sdk/python/dist/*

      - name: Upload npm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: sdk/typescript/*.tgz

  verify:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-binaries
          path: artifacts/cli

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: artifacts/python

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: artifacts/npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Smoke test CLI binary
        run: |
          chmod +x artifacts/cli/atb-linux-amd64
          ./artifacts/cli/atb-linux-amd64 version

      - name: Smoke test Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install artifacts/python/*.whl
          python -c "import atb; print(atb.__version__)"

      - name: Smoke test npm package
        run: |
          npm install artifacts/npm/*.tgz
          node -e "require('@pcguest/atb-sdk'); console.log('npm package load ok')"

      - name: Smoke test Docker image
        run: |
          docker load -i artifacts/cli/atb-docker-linux-amd64.tar
          docker run --rm atb:release-smoke version

  publish:
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-binaries
          path: artifacts/cli

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: artifacts/python

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: artifacts/npm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: |
            artifacts/cli/atb-linux-amd64
            artifacts/cli/atb-linux-arm64
            artifacts/cli/atb-darwin-amd64
            artifacts/cli/atb-darwin-arm64
            artifacts/cli/atb-windows-amd64.exe
            artifacts/cli/checksums.txt

      - name: Publish Python package (OIDC)
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          packages-dir: artifacts/python

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@pcguest"

      - name: Publish npm package (OIDC provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami
          npm publish artifacts/npm/*.tgz --access public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/atb"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${IMAGE}:v${VERSION}" \
            -t "${IMAGE}:v${MAJOR_MINOR}" \
            -t "${IMAGE}:latest" \
            --push \
            .
