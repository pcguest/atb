name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o atb-linux-amd64 ./cmd/atb
          GOOS=darwin GOARCH=amd64 go build -o atb-darwin-amd64 ./cmd/atb
          GOOS=darwin GOARCH=arm64 go build -o atb-darwin-arm64 ./cmd/atb
          GOOS=windows GOARCH=amd64 go build -o atb-windows-amd64.exe ./cmd/atb

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          last_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "${last_tag}" ]; then
            range="${last_tag}..HEAD"
          else
            range="HEAD"
          fi

          changelog="$(git log "${range}" --pretty=format:'* %s (%h)' --no-merges || true)"
          if [ -z "${changelog}" ]; then
            changelog="* no user-facing changes recorded"
          fi

          {
            echo "changelog<<EOF"
            echo "${changelog}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Install
            ```bash
            # Python
            pip install atb-sdk

            # TypeScript
            npm install @pcguest/atb-sdk
            ```

            ## Verify
            ```bash
            cd test/golden
            go test -v -run TestGoldenCanonicalization
            python3 verify.py
            node verify.js
            ```
          files: |
            atb-linux-amd64
            atb-darwin-amd64
            atb-darwin-arm64
            atb-windows-amd64.exe
          generate_release_notes: false
      
      - name: Notify Discord
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          highlights="${{ steps.changelog.outputs.changelog }}"
          highlights="$(echo "${highlights}" | head -n 10 | sed ':a;N;$!ba;s/\n/\\n/g')"
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"🎉 Release ${{ github.ref_name }} published!\\n\\n${highlights}\"}" \
            "$DISCORD_WEBHOOK_URL"
        continue-on-error: true
