name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o atb-linux-amd64 ./cmd/atb
          GOOS=darwin GOARCH=amd64 go build -o atb-darwin-amd64 ./cmd/atb
          GOOS=darwin GOARCH=arm64 go build -o atb-darwin-arm64 ./cmd/atb
          GOOS=windows GOARCH=amd64 go build -o atb-windows-amd64.exe ./cmd/atb

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          last_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "${last_tag}" ]; then
            range="${last_tag}..HEAD"
          else
            range="HEAD"
          fi

          changelog="$(git log "${range}" --pretty=format:'* %s (%h)' --no-merges || true)"
          if [ -z "${changelog}" ]; then
            changelog="* no user-facing changes recorded"
          fi

          {
            echo "changelog<<EOF"
            echo "${changelog}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Install
            ```bash
            # Python
            pip install atb-sdk

            # TypeScript
            npm install @pcguest/atb-sdk
            ```

            ## Verify
            ```bash
            cd test/golden
            go test -v -run TestGoldenCanonicalization
            python3 verify.py
            node verify.js
            ```
          files: |
            atb-linux-amd64
            atb-darwin-amd64
            atb-darwin-arm64
            atb-windows-amd64.exe
          generate_release_notes: false

      - name: Notify Discord
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          highlights="${{ steps.changelog.outputs.changelog }}"
          highlights="$(echo "${highlights}" | head -n 10 | sed ':a;N;$!ba;s/\n/\\n/g')"
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"🎉 Release ${{ github.ref_name }} published!\\n\\n${highlights}\"}" \
            "$DISCORD_WEBHOOK_URL"
        continue-on-error: true

  publish-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PY_VERSION="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('sdk/python/pyproject.toml').read_text())['project']['version'])")"
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match sdk/python/pyproject.toml version ($PY_VERSION)."
            exit 1
          fi

      - name: Build package
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI (token)
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (trusted publishing)
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

  publish-npm:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd sdk/typescript
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Publish to npm
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: sdk/typescript
        run: npm publish --access public

      - name: Warn if NPM_TOKEN is missing
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN is not configured; skipping npm publish."
