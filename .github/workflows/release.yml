name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Layers A/B/D: release-entry validation for integrity, profile-bearing
  # artifacts, and security-sensitive dependency checks.
  validate:
    name: Validate Release Inputs (Layers A/B/D)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.7"

      - name: Build atb binary for CI capture
        run: go build -tags noembed -o /tmp/atb ./cmd/atb

      - name: Add atb to PATH
        run: echo "/tmp" >> "$GITHUB_PATH"

      - name: Initialise ATB release bundle
        env:
          ATB_CI_BUNDLE_PATH: ${{ runner.temp }}/atb-release-${{ github.run_id }}.atb
        run: |
          atb capture run --bundle "$ATB_CI_BUNDLE_PATH" -- echo "bundle initialised"
          echo "ATB_CI_BUNDLE_PATH=$ATB_CI_BUNDLE_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ./sdk/python/requirements-dev.txt
          python -m pip install -e ./sdk/python[dev] --no-deps

      - name: Validate TypeScript lockfile
        working-directory: sdk/typescript
        run: npm ci --dry-run

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Install TypeScript dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Build UI Export
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify third-party notices
        run: make check-notices

      - name: Run Go tests
        run: scripts/ci-atb-capture.sh "tests-pass" -- make test-go

      - name: Run Python tests
        working-directory: sdk/python
        run: |
          pytest -q
          ruff check .
          ruff format --check .
          mypy --strict atb

      - name: Run TypeScript checks
        working-directory: sdk/typescript
        run: |
          npm run typecheck
          npm run test
          npm run build

      - name: Check version parity across all artefacts
        env:
          ATB_SKIP_TAG_CHECK: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: bash scripts/check-versions.sh

      - name: Validate tag version parity
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CLI_VERSION="$(go run ./cmd/atb version | awk '{print $2}')"
          PY_PYPROJECT="sdk/python/pyproject.toml"
          PY_SCRIPT='import pathlib, tomllib, sys'
          PY_SCRIPT="$PY_SCRIPT;"' p = pathlib.Path(sys.argv[1])'
          PY_SCRIPT="$PY_SCRIPT;"' print(tomllib.loads(p.read_text())["project"]["version"])'
          PY_VERSION="$(python -c "$PY_SCRIPT" "$PY_PYPROJECT")"
          TS_VERSION="$(node -p "require('./sdk/typescript/package.json').version")"

          if [ "$TAG_VERSION" != "$CLI_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match CLI version ($CLI_VERSION)."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match sdk/python version ($PY_VERSION)."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$TS_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match sdk/typescript version ($TS_VERSION)."
            exit 1
          fi

      - name: Upload ATB release bundle checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atb-release-bundle-validate-${{ github.run_id }}
          path: ${{ env.ATB_CI_BUNDLE_PATH }}

  # Layers A/B/D: build verified release artifacts for the non-Docker release path.
  build:
    name: Build Release Artifacts (Layers A/B/D)
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.7"

      - name: Build atb binary for CI capture
        run: go build -tags noembed -o /tmp/atb ./cmd/atb

      - name: Add atb to PATH
        run: echo "/tmp" >> "$GITHUB_PATH"

      - name: Download ATB release bundle checkpoint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atb-release-bundle-validate-${{ github.run_id }}
          path: ${{ runner.temp }}/atb-release-capture

      - name: Set ATB release bundle path
        run: |
          BUNDLE_PATH="${{ runner.temp }}/atb-release-capture/atb-release-${{ github.run_id }}.atb"
          echo "ATB_CI_BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Build UI Export
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build CLI binaries
        run: |
          scripts/ci-atb-capture.sh "binary-built" -- bash -c '
            set -euo pipefail
            mkdir -p dist/release
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-linux-amd64 ./cmd/atb
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-linux-arm64 ./cmd/atb
            GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-darwin-amd64 ./cmd/atb
            GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-darwin-arm64 ./cmd/atb
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-windows-amd64.exe ./cmd/atb
            cp LICENSE THIRD_PARTY_NOTICES dist/release/
            (cd dist/release && sha256sum atb-* LICENSE THIRD_PARTY_NOTICES > checksums.txt)
          '

      - name: Build Python artifacts
        working-directory: sdk/python
        run: |
          python -m pip install -r requirements-release.txt
          python -m build --no-isolation
          twine check dist/*

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Build npm artifact
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build
          npm pack --silent

      - name: Archive web export
        run: |
          mkdir -p dist/web
          cp LICENSE THIRD_PARTY_NOTICES web/out/
          tar -C web/out -czf "dist/web/atb-web-${GITHUB_SHA}.tar.gz" .

      - name: Prepare release metadata directories
        run: mkdir -p dist/sbom dist/provenance

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom/atb.spdx.json
          upload-artifact: false

      - name: Generate release provenance manifest
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          candidates = [
              *Path("dist/release").glob("*"),
              *Path("sdk/python/dist").glob("*"),
              *Path("sdk/typescript").glob("*.tgz"),
              *Path("dist/web").glob("*"),
              *Path("dist/sbom").glob("*"),
          ]
          files = []
          for path in sorted(candidate for candidate in candidates if candidate.is_file()):
              data = path.read_bytes()
              files.append({
                  "path": path.as_posix(),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              })
          payload = {
              "schema": "atb.release.provenance.v1",
              "commit": os.environ["RELEASE_COMMIT"],
              "ref": os.environ["RELEASE_REF"],
              "files": files,
          }
          Path("dist/provenance/release-provenance.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload CLI binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-binaries
          path: dist/release/*

      - name: Upload Python dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: sdk/python/dist/*

      - name: Upload npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: sdk/typescript/*.tgz

      - name: Upload web export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-export
          path: dist/web/*

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: dist/sbom/*

      - name: Upload provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance
          path: dist/provenance/*

      - name: Upload ATB release bundle checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atb-release-bundle-build-${{ github.run_id }}
          path: ${{ env.ATB_CI_BUNDLE_PATH }}

  # Layers A/B/D: re-verify shipped artifacts before any publication step.
  verify:
    name: Verify Release Artifacts (Layers A/B/D)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries
          path: artifacts/cli

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: artifacts/python

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts/npm

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-export
          path: artifacts/web

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: artifacts/sbom

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance
          path: artifacts/provenance

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Smoke test CLI binary
        run: |
          chmod +x artifacts/cli/atb-linux-amd64
          ./artifacts/cli/atb-linux-amd64 version

      - name: Smoke test Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install artifacts/python/*.whl
          python -c "import atb; print(atb.__version__)"
          python - <<'PY'
          import pathlib, tarfile, zipfile

          for artifact in pathlib.Path("artifacts/python").iterdir():
              if artifact.suffix == ".whl":
                  names = zipfile.ZipFile(artifact).namelist()
              elif artifact.name.endswith(".tar.gz"):
                  names = tarfile.open(artifact, "r:gz").getnames()
              else:
                  continue
              assert any(name.endswith("LICENSE") for name in names), artifact
              assert any(name.endswith("THIRD_PARTY_NOTICES") for name in names), artifact
          PY

      - name: Smoke test npm package
        run: |
          tar -tzf artifacts/npm/*.tgz | grep -q '^package/LICENSE$'
          tar -tzf artifacts/npm/*.tgz | grep -q '^package/THIRD_PARTY_NOTICES$'
          npm install artifacts/npm/*.tgz
          node -e "require('@pcguest/atb-sdk'); console.log('npm package load ok')"

      - name: Verify web, SBOM, and provenance assets
        run: |
          tar -tzf artifacts/web/*.tar.gz | grep -q '^./LICENSE$'
          tar -tzf artifacts/web/*.tar.gz | grep -q '^./THIRD_PARTY_NOTICES$'
          test -s artifacts/cli/LICENSE
          test -s artifacts/cli/THIRD_PARTY_NOTICES
          jq -e '.spdxVersion and .packages' artifacts/sbom/*.json >/dev/null
          # Recompute artifact hashes against the manifest: structural checks
          # alone would pass even if the shipped files did not match it.
          python - <<'PY'
          import hashlib, json, pathlib, sys

          manifest_path = next(pathlib.Path("artifacts/provenance").glob("*.json"))
          data = json.loads(manifest_path.read_text())
          assert data["schema"] == "atb.release.provenance.v1", data.get("schema")
          assert data["files"], "provenance manifest lists no files"

          expected = {pathlib.PurePosixPath(f["path"]).name: f for f in data["files"]}
          actual = {
              p.name: p
              for d in ("cli", "python", "npm", "web", "sbom")
              for p in pathlib.Path("artifacts", d).glob("*")
              if p.is_file()
          }

          problems = []
          for name, entry in sorted(expected.items()):
              path = actual.get(name)
              if path is None:
                  problems.append(f"manifest entry {name} has no downloaded artifact")
                  continue
              blob = path.read_bytes()
              if hashlib.sha256(blob).hexdigest() != entry["sha256"]:
                  problems.append(f"sha256 mismatch for {name}")
              elif len(blob) != entry["size"]:
                  problems.append(f"size mismatch for {name}")
          for name in sorted(actual):
              if name not in expected:
                  problems.append(f"artifact {name} is not covered by the provenance manifest")
          if problems:
              sys.exit("provenance verification failed:\n  " + "\n  ".join(problems))
          print(f"provenance verified: {len(expected)} files match the manifest")
          PY

  # Layer C: Gold release gate — must pass before any publication step.
  gate-gold:
    name: Gold Release Gate (Layer C)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.7"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Install dependencies
        run: |
          go mod download
          python -m pip install -r ./sdk/python/requirements-dev.txt
          cd web && npm ci
          cd ../sdk/typescript && npm ci

      - name: Build web assets
        run: cd web && npm run build

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0
          cache: true

      - name: Run gold release gate
        run: make gate-gold-release

      - name: Upload gate artefacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-gold-artefacts
          path: |
            coverage.out
            web/lhci-reports/
            web/cypress/videos/

  # Layer E: distribute non-Docker release artifacts only after validation, build, and verification have passed.
  publish:
    name: Publish Verified Artifacts (Layer E)
    runs-on: ubuntu-latest
    needs: [verify, gate-gold]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.7"

      - name: Build atb binary for CI capture
        run: go build -tags noembed -o /tmp/atb ./cmd/atb

      - name: Add atb to PATH
        run: echo "/tmp" >> "$GITHUB_PATH"

      - name: Download ATB release bundle checkpoint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atb-release-bundle-build-${{ github.run_id }}
          path: ${{ runner.temp }}/atb-release-capture

      - name: Set ATB release bundle path
        run: |
          BUNDLE_PATH="${{ runner.temp }}/atb-release-capture/atb-release-${{ github.run_id }}.atb"
          echo "ATB_CI_BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries
          path: artifacts/cli

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: artifacts/python

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts/npm

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-export
          path: artifacts/web

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: artifacts/sbom

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance
          path: artifacts/provenance

      - name: Snapshot release state
        run: atb snapshot "release-${{ github.ref_name }}" --bundle "$ATB_CI_BUNDLE_PATH"

      - name: Preflight release signing key
        env:
          ATB_SIGNING_KEY_PEM: ${{ secrets.ATB_SIGNING_KEY_PEM }}
        run: |
          if [ -z "$ATB_SIGNING_KEY_PEM" ]; then
            echo "ATB_SIGNING_KEY_PEM is not configured" >&2
            exit 1
          fi
          key_path="$(mktemp)"
          bundle_copy="$(mktemp)"
          trap 'rm -f "$key_path" "$bundle_copy"' EXIT
          printf '%s\n' "$ATB_SIGNING_KEY_PEM" > "$key_path"
          chmod 600 "$key_path"
          cp "$ATB_CI_BUNDLE_PATH" "$bundle_copy"
          atb sign --bundle "$bundle_copy" --key "$key_path"
          atb verify --bundle "$bundle_copy"

      - name: Refuse to overwrite published package versions
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          check_absent() {
            local label="$1" url="$2" status
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
            case "$status" in
              404) ;;
              200)
                echo "$label@$VERSION already exists; refusing an unverifiable overwrite or skip" >&2
                exit 1
                ;;
              *)
                echo "could not establish whether $label@$VERSION exists (HTTP $status)" >&2
                exit 1
                ;;
            esac
          }
          check_absent "atb-sdk" "https://pypi.org/pypi/atb-sdk/${VERSION}/json"
          check_absent "@pcguest/atb-sdk" "https://registry.npmjs.org/@pcguest%2Fatb-sdk/${VERSION}"

      # Layer E: distribution of verified release artifacts to GitHub, PyPI, and npm.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          draft: true
          generate_release_notes: true
          overwrite_files: true
          files: |
            artifacts/cli/atb-linux-amd64
            artifacts/cli/atb-linux-arm64
            artifacts/cli/atb-darwin-amd64
            artifacts/cli/atb-darwin-arm64
            artifacts/cli/atb-windows-amd64.exe
            artifacts/cli/checksums.txt
            artifacts/cli/LICENSE
            artifacts/cli/THIRD_PARTY_NOTICES
            artifacts/python/*
            artifacts/npm/*
            artifacts/web/*
            artifacts/sbom/*
            artifacts/provenance/*

      - name: Publish Python package (OIDC)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: artifacts/python

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@pcguest"

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The single-quoted script is intentionally evaluated by the inner bash.
          # shellcheck disable=SC2016
          scripts/ci-atb-capture.sh "npm-publication-verified" -- bash -c '
            set -euo pipefail
            npm whoami
            mapfile -t package_tarballs < <(find artifacts/npm -maxdepth 1 -name "*.tgz" -print)
            if [ "${#package_tarballs[@]}" -ne 1 ]; then
              echo "expected exactly one npm package tarball, found ${#package_tarballs[@]}" >&2
              exit 1
            fi
            package_tarball="${package_tarballs[0]}"
            npm publish "$package_tarball" --access public
          '

      - name: Sign final release bundle
        env:
          ATB_SIGNING_KEY_PEM: ${{ secrets.ATB_SIGNING_KEY_PEM }}
        run: |
          key_path="$(mktemp)"
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "$ATB_SIGNING_KEY_PEM" > "$key_path"
          chmod 600 "$key_path"
          atb sign --bundle "$ATB_CI_BUNDLE_PATH" --key "$key_path"

      - name: Verify final signed release bundle
        run: atb verify --bundle "$ATB_CI_BUNDLE_PATH"

      - name: Attach signed release bundle and finalize release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_bundle="atb-release-${GITHUB_REF_NAME}.atb"
          cp "$ATB_CI_BUNDLE_PATH" "$release_bundle"
          gh release upload "${GITHUB_REF_NAME}" "$release_bundle" --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false

      - name: Upload ATB release bundle as artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atb-release-bundle-${{ github.run_id }}
          path: ${{ env.ATB_CI_BUNDLE_PATH }}
          retention-days: 365
