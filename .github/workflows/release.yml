name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Layers A/B/D: release-entry validation for integrity, profile-bearing
  # artifacts, and security-sensitive dependency checks.
  validate:
    name: Validate Release Inputs (Layers A/B/D)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.4"

      - name: Build atb binary for CI capture
        run: go build -tags noembed -o /tmp/atb ./cmd/atb

      - name: Add atb to PATH
        run: echo "/tmp" >> "$GITHUB_PATH"

      - name: Initialise ATB release bundle
        env:
          ATB_CI_BUNDLE_PATH: ${{ runner.temp }}/atb-release-${{ github.run_id }}.atb
        run: |
          atb capture run --bundle "$ATB_CI_BUNDLE_PATH" -- echo "bundle initialised"
          echo "ATB_CI_BUNDLE_PATH=$ATB_CI_BUNDLE_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./sdk/python[dev]

      - name: Validate TypeScript lockfile
        working-directory: sdk/typescript
        run: npm ci --dry-run

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Install TypeScript dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Build UI Export
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run Go tests
        run: scripts/ci-atb-capture.sh "tests-pass" -- make test-go

      - name: Run Python tests
        working-directory: sdk/python
        run: pytest -q

      - name: Run TypeScript checks
        working-directory: sdk/typescript
        run: |
          npm run typecheck
          npm run test
          npm run build

      - name: Check version parity across all artefacts
        run: bash scripts/check-versions.sh

      - name: Validate tag version parity
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CLI_VERSION="$(go run ./cmd/atb version | awk '{print $2}')"
          PY_PYPROJECT="sdk/python/pyproject.toml"
          PY_SCRIPT='import pathlib, tomllib, sys'
          PY_SCRIPT="$PY_SCRIPT;"' p = pathlib.Path(sys.argv[1])'
          PY_SCRIPT="$PY_SCRIPT;"' print(tomllib.loads(p.read_text())["project"]["version"])'
          PY_VERSION="$(python -c "$PY_SCRIPT" "$PY_PYPROJECT")"
          TS_VERSION="$(node -p "require('./sdk/typescript/package.json').version")"

          if [ "$TAG_VERSION" != "$CLI_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match CLI version ($CLI_VERSION)."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match sdk/python version ($PY_VERSION)."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$TS_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match sdk/typescript version ($TS_VERSION)."
            exit 1
          fi

      - name: Upload ATB release bundle checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atb-release-bundle-validate-${{ github.run_id }}
          path: ${{ env.ATB_CI_BUNDLE_PATH }}

  # Layers A/B/D: build verified release artifacts for the non-Docker release path.
  build:
    name: Build Release Artifacts (Layers A/B/D)
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.4"

      - name: Build atb binary for CI capture
        run: go build -tags noembed -o /tmp/atb ./cmd/atb

      - name: Add atb to PATH
        run: echo "/tmp" >> "$GITHUB_PATH"

      - name: Download ATB release bundle checkpoint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atb-release-bundle-validate-${{ github.run_id }}
          path: ${{ runner.temp }}/atb-release-capture

      - name: Set ATB release bundle path
        run: |
          BUNDLE_PATH="${{ runner.temp }}/atb-release-capture/atb-release-${{ github.run_id }}.atb"
          echo "ATB_CI_BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Build UI Export
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build CLI binaries
        run: |
          scripts/ci-atb-capture.sh "binary-built" -- bash -c '
            set -euo pipefail
            mkdir -p dist/release
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-linux-amd64 ./cmd/atb
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-linux-arm64 ./cmd/atb
            GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-darwin-amd64 ./cmd/atb
            GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-darwin-arm64 ./cmd/atb
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/release/atb-windows-amd64.exe ./cmd/atb
            (cd dist/release && sha256sum atb-* > checksums.txt)
          '

      - name: Build Python artifacts
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Build npm artifact
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build
          npm pack --silent

      - name: Upload CLI binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-binaries
          path: dist/release/*

      - name: Upload Python dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: sdk/python/dist/*

      - name: Upload npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: sdk/typescript/*.tgz

      - name: Upload ATB release bundle checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atb-release-bundle-build-${{ github.run_id }}
          path: ${{ env.ATB_CI_BUNDLE_PATH }}

  # Layers A/B/D: re-verify shipped artifacts before any publication step.
  verify:
    name: Verify Release Artifacts (Layers A/B/D)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries
          path: artifacts/cli

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: artifacts/python

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts/npm

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Smoke test CLI binary
        run: |
          chmod +x artifacts/cli/atb-linux-amd64
          ./artifacts/cli/atb-linux-amd64 version

      - name: Smoke test Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install artifacts/python/*.whl
          python -c "import atb; print(atb.__version__)"

      - name: Smoke test npm package
        run: |
          npm install artifacts/npm/*.tgz
          node -e "require('@pcguest/atb-sdk'); console.log('npm package load ok')"

  # Layer C: Gold release gate — must pass before any publication step.
  gate-gold:
    name: Gold Release Gate (Layer C)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.4"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Install dependencies
        run: |
          go mod download
          cd web && npm ci
          cd ../sdk/typescript && npm ci

      - name: Build web assets
        run: cd web && npm run build

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run gold release gate
        run: make gate-gold-release

      - name: Upload gate artefacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-gold-artefacts
          path: |
            coverage.out
            web/lhci-reports/
            web/cypress/videos/

  # Layer E: distribute non-Docker release artifacts only after validation, build, and verification have passed.
  publish:
    name: Publish Verified Artifacts (Layer E)
    runs-on: ubuntu-latest
    needs: [verify, gate-gold]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.4"

      - name: Build atb binary for CI capture
        run: go build -tags noembed -o /tmp/atb ./cmd/atb

      - name: Add atb to PATH
        run: echo "/tmp" >> "$GITHUB_PATH"

      - name: Download ATB release bundle checkpoint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atb-release-bundle-build-${{ github.run_id }}
          path: ${{ runner.temp }}/atb-release-capture

      - name: Set ATB release bundle path
        run: |
          BUNDLE_PATH="${{ runner.temp }}/atb-release-capture/atb-release-${{ github.run_id }}.atb"
          echo "ATB_CI_BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-binaries
          path: artifacts/cli

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: artifacts/python

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifacts/npm

      # Layer E: distribution of verified release artifacts to GitHub, PyPI, and npm.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          files: |
            artifacts/cli/atb-linux-amd64
            artifacts/cli/atb-linux-arm64
            artifacts/cli/atb-darwin-amd64
            artifacts/cli/atb-darwin-arm64
            artifacts/cli/atb-windows-amd64.exe
            artifacts/cli/checksums.txt

      - name: Publish Python package (OIDC)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: artifacts/python
          skip-existing: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@pcguest"

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          scripts/ci-atb-capture.sh "npm-published" -- bash -c '
            set -euo pipefail
            npm whoami
            npm publish artifacts/npm/*.tgz --access public
          '

      - name: Snapshot release state
        run: atb snapshot "release-${{ github.ref_name }}" --bundle "$ATB_CI_BUNDLE_PATH"

      - name: Sign release bundle
        run: |
          # MAINTAINER: Add ATB_SIGNING_KEY_PEM to repo secrets.
          # Key material injected from GitHub secret; never stored in the repo.
          echo "${{ secrets.ATB_SIGNING_KEY_PEM }}" > /tmp/atb-ci-signing.pem
          chmod 600 /tmp/atb-ci-signing.pem
          atb sign --bundle "$ATB_CI_BUNDLE_PATH" --key /tmp/atb-ci-signing.pem
          rm -f /tmp/atb-ci-signing.pem

      - name: Verify signed release bundle
        run: atb verify --bundle "$ATB_CI_BUNDLE_PATH"

      - name: Upload ATB release bundle as artefact
        uses: actions/upload-artifact@v4
        with:
          name: atb-release-bundle-${{ github.run_id }}
          path: ${{ env.ATB_CI_BUNDLE_PATH }}
          retention-days: 365
