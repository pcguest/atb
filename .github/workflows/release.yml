name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build release binaries for all platforms
  # ─────────────────────────────────────────────────────────────────────────────
  build-release-binaries:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: linux-arm64
            runner: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - os: darwin-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
          - os: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ github.ref_name }}"
          BINARY="atb-${VERSION}-${{ matrix.os }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "dist/${BINARY}" \
            ./cmd/atb
          echo "BINARY_NAME=${BINARY}" >> $GITHUB_ENV
        shell: bash

      - name: Create archive
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${BINARY_NAME%.exe}.zip" "$BINARY_NAME"
          else
            tar czf "${BINARY_NAME}.tar.gz" "$BINARY_NAME"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/atb-*
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release-binaries

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/
          merge-multiple: true

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ATB ${{ github.ref_name }}"
          body: |
            ## ATB ${{ github.ref_name }}

            ### What's Changed
            ${{ env.CHANGELOG }}

            ### Installation

            **macOS (Apple Silicon)**
            ```bash
            curl -L https://github.com/pcguest/atb/releases/download/${{ github.ref_name }}/atb-${{ github.ref_name }}-darwin-arm64.tar.gz | tar xz
            sudo mv atb-* /usr/local/bin/atb
            ```

            **Linux (x86_64)**
            ```bash
            curl -L https://github.com/pcguest/atb/releases/download/${{ github.ref_name }}/atb-${{ github.ref_name }}-linux-amd64.tar.gz | tar xz
            sudo mv atb-* /usr/local/bin/atb
            ```

            **Windows**
            Download the `.zip` file below and extract `atb.exe` to your PATH.

            ### Python SDK
            ```bash
            pip install atb-sdk==${{ github.ref_name }}
            ```
          files: dist/*
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Notify Discord of release
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 ATB ${{ github.ref_name }} Released!\",
                \"description\": \"A new version of ATB has been released.\n\n[View Release](https://github.com/pcguest/atb/releases/tag/${{ github.ref_name }})\",
                \"color\": 5814783,
                \"fields\": [
                  {\"name\": \"Version\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                  {\"name\": \"Author\", \"value\": \"${{ github.actor }}\", \"inline\": true}
                ]
              }]
            }" || true
