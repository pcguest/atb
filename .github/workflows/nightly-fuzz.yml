name: Nightly Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    name: Parser and canonicalizer fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: go1.26.4
      FUZZTIME: 5m
      GOCACHE: ${{ runner.temp }}/go-build
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"

      - name: Unit smoke before fuzzing
        run: go test ./internal/canonicalize/... ./internal/bundle/... -count=1

      - name: Run bounded fuzz targets
        run: make fuzz

      - name: Archive fuzz corpus and crashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atb-fuzz-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/go-build/fuzz
            internal/**/testdata/fuzz
          if-no-files-found: ignore
          retention-days: 14
