name: Export Public Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Dry-run public export
        run: bash scripts/export-public-demo.sh --dry-run --output /tmp/atb-demo-export

      - name: Upload export review artefact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: export-review
          path: /tmp/atb-demo-export/EXPORT_REVIEW.md
