name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Layers A/B: core integrity, SDK validation, and docs/CLI sync gates.
  test:
    name: Core Validation (Layers A/B)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.9"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Build UI Export
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build Go CLI
        run: go build -v ./...

      - name: Check internal Markdown links
        shell: bash
        run: |
          set -euo pipefail
          find README.md docs -type f -name '*.md' -exec \
            npx --yes markdown-link-check --quiet --config .markdown-link-check.json {} \;

      - name: Installed binary smoke gate
        run: go test -v -run TestInstalledBinarySmokeFlow ./cmd/atb

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Python SDK dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./sdk/python[dev]

      - name: Test Go packages
        run: go test -race -v -skip TestInstalledBinarySmokeFlow ./...

      - name: Test Python SDK
        working-directory: sdk/python
        run: pytest

      - name: Typecheck TypeScript SDK
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Test TypeScript SDK
        working-directory: sdk/typescript
        run: npm test

      - name: Docs sync smoke check
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/quickstart.md

          go run ./cmd/atb --help > /tmp/atb-help.txt
          CLI_VERSION="$(go run ./cmd/atb version | awk '{print $2}')"
          CLI_TAG="v${CLI_VERSION}"

          grep -Fq "bundle new [--dry-run]" /tmp/atb-help.txt
          grep -Fq -- "--profile <id|path>" /tmp/atb-help.txt
          grep -Fq "view [bundle_path]" /tmp/atb-help.txt
          grep -Fq "snapshot <name>" /tmp/atb-help.txt
          grep -q "^## \\[${CLI_TAG}\\]" CHANGELOG.md
          grep -Fq "Current release: [\`${CLI_TAG}\`](CHANGELOG.md)" README.md
          grep -Fq "atb bundle new" README.md
          grep -Fq -- "--profile atb.profile.privileged_tool_action" README.md
          grep -Fq "atb bundle new" docs/quickstart.md
          grep -Fq -- "--profile atb.profile.privileged_tool_action" docs/quickstart.md
          grep -Fq "atb view" docs/quickstart.md
          grep -Fq "bundle-push.md (forthcoming)" docs/spec-v1.0.md

      - name: Notify Discord
        if: ${{ always() && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"CI Build ${{ job.status }}: ${{ github.workflow }} #${{ github.run_number }}\"}" \
            "$DISCORD_WEBHOOK_URL"
        continue-on-error: true

  # Layers A/B: multi-language golden canonicalization and parity checks.
  golden-test:
    name: Golden Parity (Layers A/B)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.9"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Python SDK dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./sdk/python

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Run golden canonicalization test
        run: go test ./test/golden/... -run TestGoldenCanonicalization -v

      - name: Run schema parity test
        env:
          ATB_PYTHON_BIN: python
        run: go test ./test/golden/... -run TestSchemaParity_AllSDKs -v

      - name: Run encryption parity test
        env:
          ATB_PYTHON_BIN: python
        run: go test ./test/golden/... -run TestEncryptParity_AllSDKs -v

      - name: Run Python golden verification
        working-directory: test/golden
        run: python3 verify.py

      - name: Run TypeScript golden verification
        working-directory: test/golden
        run: node verify.js

      - name: Compare canonical JSON and hashes
        working-directory: test/golden
        run: |
          diff output-go.json output-python.json
          diff output-python.json output-typescript.json
          diff hash-go.txt hash-python.txt
          diff hash-python.txt hash-typescript.txt
          echo "✅ all language outputs are byte-identical"

  # Layer C: ACP control-plane invariant for gated actions.
  acp-gate:
    name: ACP Control-Plane Gate (Layer C)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.9"

      - name: Seed minimal UI embed tree
        run: |
          mkdir -p web/out
          touch web/out/acp-gate-placeholder.txt

      - name: Run ACP control-plane gate
        run: go test -tags=integration ./internal/integration/... -run TestACPControlPlaneGate -v
