name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build Go CLI
        run: go build -v ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python SDK
        working-directory: sdk/python
        run: |
          pip install -e .
          pip install pytest

      - name: Test Go packages
        run: go test -v ./...

      - name: Test Python SDK
        working-directory: sdk/python
        run: pytest

      - name: Typecheck TypeScript SDK
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Docs sync smoke check
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/quickstart.md
          test -f docs/spec/atb-push-v1.1.md

          go run ./cmd/atb --help > /tmp/atb-help.txt

          grep -q "view \\[bundle_path\\]" /tmp/atb-help.txt
          grep -q "snapshot <name>" /tmp/atb-help.txt
          grep -q "atb verify" README.md
          grep -q "atb view" docs/quickstart.md
          grep -q "atb push" docs/spec/atb-push-v1.1.md

      - name: Notify Discord
        if: ${{ always() && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"CI Build ${{ job.status }}: ${{ github.workflow }} #${{ github.run_number }}\"}" \
            "$DISCORD_WEBHOOK_URL"
        continue-on-error: true

  golden-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python SDK dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./sdk/python

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Run golden canonicalization test
        run: go test ./test/golden/... -run TestGoldenCanonicalization -v

      - name: Run schema parity test
        env:
          ATB_PYTHON_BIN: python
        run: go test ./test/golden/... -run TestSchemaParity_AllSDKs -v

      - name: Run encryption parity test
        env:
          ATB_PYTHON_BIN: python
        run: go test ./test/golden/... -run TestEncryptParity_AllSDKs -v

      - name: Run Python golden verification
        working-directory: test/golden
        run: python3 verify.py

      - name: Run TypeScript golden verification
        working-directory: test/golden
        run: node verify.js

      - name: Compare canonical JSON and hashes
        working-directory: test/golden
        run: |
          diff output-go.json output-python.json
          diff output-python.json output-typescript.json
          diff hash-go.txt hash-python.txt
          diff hash-python.txt hash-typescript.txt
          echo "✅ all language outputs are byte-identical"
