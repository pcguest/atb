name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Layers A/B: core integrity, SDK validation, and docs/CLI sync gates.
  test:
    name: Core Validation (Layers A/B)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Build UI Export
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test web UI (Vitest)
        working-directory: web
        run: npm test -- --run

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Install TypeScript SDK dependencies
        working-directory: sdk/typescript
        run: npm ci

      - name: Build Go CLI
        run: go build -v ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          ./scripts/govulncheck.sh

      - name: Check internal Markdown links
        shell: bash
        run: |
          set -euo pipefail
          find README.md docs -type f -name '*.md' -exec \
            npx --yes markdown-link-check --quiet --config .markdown-link-check.json {} \;

      - name: Installed binary smoke gate
        run: go test -v -run TestInstalledBinarySmokeFlow ./cmd/atb

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Python SDK dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./sdk/python[dev]

      - name: Test Go packages
        shell: bash
        run: |
          go run ./scripts/generate_profile_fixtures.go
          go test -race -v -skip TestInstalledBinarySmokeFlow $(go list ./... | grep -v '/web/node_modules/')

      - name: Test Python SDK
        working-directory: sdk/python
        run: pytest

      - name: Typecheck TypeScript SDK
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: Test TypeScript SDK
        working-directory: sdk/typescript
        run: npm test

      - name: Quality evidence summary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./scripts/quality-evidence.sh

      - name: Docs sync smoke check
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/quickstart.md
          test -f docs/roadmap.md

          go run ./cmd/atb --help > /tmp/atb-help.txt
          CLI_VERSION="$(go run ./cmd/atb version | awk '{print $2}')"
          CLI_TAG="v${CLI_VERSION}"

          grep -Fq "bundle new [--dry-run]" /tmp/atb-help.txt
          grep -Fq -- "--profile <id|path>" /tmp/atb-help.txt
          grep -Fq "view [bundle_path]" /tmp/atb-help.txt
          grep -Fq "snapshot <name>" /tmp/atb-help.txt
          grep -q "^## \\[${CLI_TAG}\\]" CHANGELOG.md
          grep -Fq "Current release: [\`${CLI_TAG}\`](CHANGELOG.md)" README.md
          grep -Fq "atb bundle new" README.md
          grep -Fq -- "--profile atb.profile.policy_decision" README.md
          grep -Fq "atb bundle new" docs/quickstart.md
          grep -Fq -- "--profile atb.profile.privileged_tool_action" docs/quickstart.md
          grep -Fq "atb view" docs/quickstart.md
          ! grep -Eq "forthcoming|planned extension" docs/spec-v1.0.md

      - name: Web E2E (mock API)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go build -o /tmp/atb-e2e ./cmd/atb
          npm --prefix web ci
          npm --prefix web run build
          /tmp/atb-e2e view --no-open --port 18888 >/tmp/atb-e2e.log 2>&1 & echo $! >/tmp/atb-e2e.pid
          sleep 3
          CYPRESS_MOCK_API=true CYPRESS_BASE_URL=http://127.0.0.1:18888 npm --prefix web run test:e2e
          kill $(cat /tmp/atb-e2e.pid) 2>/dev/null || true

      - name: Notify Discord
        if: ${{ always() && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"CI Build ${{ job.status }}: ${{ github.workflow }} #${{ github.run_number }}\"}" \
            "$DISCORD_WEBHOOK_URL"
        continue-on-error: true

  # Layers A/B: multi-language golden canonicalization and parity checks.
  golden-test:
    name: Golden Parity (Layers A/B)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Python SDK dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./sdk/python

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Run golden canonicalization test
        run: go test ./test/golden/... -run TestGoldenCanonicalization -v

      - name: Run schema parity test
        env:
          ATB_PYTHON_BIN: python
        run: go test ./test/golden/... -run TestSchemaParity_AllSDKs -v

      - name: Run encryption parity test
        env:
          ATB_PYTHON_BIN: python
        run: go test ./test/golden/... -run TestEncryptParity_AllSDKs -v

      - name: Run Python golden verification
        working-directory: test/golden
        run: python3 verify.py

      - name: Run TypeScript golden verification
        working-directory: test/golden
        run: node verify.js

      - name: Compare canonical JSON and hashes
        working-directory: test/golden
        run: |
          diff output-go.json output-python.json
          diff output-python.json output-typescript.json
          diff hash-go.txt hash-python.txt
          diff hash-python.txt hash-typescript.txt
          echo "✅ all language outputs are byte-identical"

  # Layer C: ACP control-plane invariant for gated actions.
  acp-gate:
    name: Profile Parity Gate (Layer C)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"

      - name: Seed minimal UI embed tree
        run: |
          mkdir -p web/out
          touch web/out/acp-gate-placeholder.txt

      - name: Run ACP control-plane gate
        run: go test -tags=integration ./internal/integration/... -run TestACPControlPlaneGate -v
