name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Build Go CLI
        run: go build -v ./...
      
      - name: Test Go packages
        run: go test -v ./...
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python SDK
        run: |
          cd sdk/python
          pip install -e .
          pip install pytest
      
      - name: Test Python SDK
        run: |
          cd sdk/python
          pytest
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Typecheck TypeScript SDK
        run: |
          cd sdk/typescript
          npm ci
          npm run typecheck

      - name: Docs sync smoke check
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/quickstart.md
          test -f docs/spec/atb-push-v1.1.md

          go run ./cmd/atb --help > /tmp/atb-help.txt

          grep -q "view \\[bundle_path\\]" /tmp/atb-help.txt
          grep -q "snapshot <name>" /tmp/atb-help.txt
          grep -q "atb view" README.md
          grep -q "atb view" docs/quickstart.md
          grep -q "atb push" docs/spec/atb-push-v1.1.md

      - name: Notify Discord
        if: ${{ always() && env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"CI Build ${{ job.status }}: ${{ github.workflow }} #${{ github.run_number }}\"}" \
            "$DISCORD_WEBHOOK_URL"
        continue-on-error: true

  golden-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build TypeScript SDK
        run: |
          cd sdk/typescript
          npm ci
          npm run build

      - name: Run Go golden test
        run: |
          cd test/golden
          go test -v -run TestGoldenCanonicalization

      - name: Run Python golden verification
        run: |
          cd test/golden
          python3 verify.py

      - name: Run TypeScript golden verification
        run: |
          cd test/golden
          node verify.js

      - name: Compare canonical JSON and hashes
        run: |
          cd test/golden
          diff output-go.json output-python.json
          diff output-python.json output-typescript.json
          diff hash-go.txt hash-python.txt
          diff hash-python.txt hash-typescript.txt
          echo "✅ all language outputs are byte-identical"
