name: Gold Release Gate

"on":
  push:
    tags:
      - "v*.*.*"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.4"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Remove node_modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @('node_modules','web/node_modules','sdk/typescript/node_modules')
          foreach ($d in $dirs) {
            if (Test-Path $d) { Remove-Item -Recurse -Force $d }
          }

      - name: Install Dependencies
        run: |
          go mod download
          cd web && npm ci
          cd ../sdk/typescript && npm ci

      - name: Build Web Assets
        run: cd web && npm run build

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Run Gold Gate
        run: make gate-gold-release

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            coverage.out
            web/lhci-reports/
            web/cypress/videos/
