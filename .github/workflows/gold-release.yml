---
name: Gold Release Gate
# Actions temporarily use major tags; re-pin to SHAs in the gold release checklist.

"on":
  push:
    tags:
      - "v*.*.*"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          go mod download
          cd web && npm ci

      - name: Run Gold Gate
        run: make gate-gold-release

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: |
            coverage.out
            web/lhci-reports/
            web/cypress/videos/
