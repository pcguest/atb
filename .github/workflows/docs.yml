name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material mkdocstrings[python]

      - name: Build docs site
        run: |
          # If mkdocs.yml exists, use it; otherwise create a minimal one.
          if [ ! -f mkdocs.yml ]; then
            cat > mkdocs.yml << 'EOF'
          site_name: ATB Documentation
          site_url: https://pcguest.github.io/atb
          repo_url: https://github.com/pcguest/atb
          repo_name: pcguest/atb
          theme:
            name: material
            palette:
              scheme: slate
              primary: indigo
              accent: cyan
            font:
              text: Inter
              code: JetBrains Mono
            features:
              - navigation.tabs
              - navigation.sections
              - content.code.copy
          nav:
            - Home: index.md
            - CLI Reference: cli.md
            - Python SDK: python-sdk.md
            - TypeScript SDK: typescript-sdk.md
            - Spec: spec.md
            - Changelog: changelog.md
          EOF
          fi

          # Copy docs and root files.
          mkdir -p docs_build
          cp -r docs/* docs_build/ 2>/dev/null || true
          cp README.md docs_build/index.md 2>/dev/null || true
          cp CHANGELOG.md docs_build/changelog.md 2>/dev/null || true

          mkdocs build --site-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-docs:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
