name: Release gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.7"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install golden-vector dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r ./sdk/python/requirements-dev.txt
          .venv/bin/python -m pip install -e './sdk/python[dev]' --no-deps
          npm --prefix sdk/typescript ci

      - name: Cross-language golden vectors
        run: make test-golden

      # The Go suite needs the same preconditions as a maintainer checkout:
      # generated profile fixture bundles (gitignored, deterministic) and the
      # exported web viewer (embedded by uiembed.go and asserted by the
      # installed-binary smoke test).
      - name: Generate profile fixtures
        run: go run ./scripts/generate_profile_fixtures.go

      - name: Build web viewer export
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Add venv to PATH
        run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Full Go suite
        shell: bash
        run: |
          go_packages=()
          while IFS= read -r package; do
            go_packages+=("$package")
          done < <(go list ./... | grep -v '/node_modules/')
          go test "${go_packages[@]}" -count=1
