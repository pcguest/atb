name: Docker Publish (Layer E)

on:
  # Publication is manual only. Tag pushes must not publish images; there is no
  # automatic path from a tag to a registry write.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm this publication'
        required: true
        type: string
      tag:
        description: "Stable release tag (e.g. v1.16.0)"
        required: true
        type: string
      expected_sha:
        description: "Full 40-hex commit SHA that the tag must resolve to"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Founder-controlled publication gate. Fails closed until the repository
  # variable RELEASE_GATE_ENABLED is "true" and the "docker-release" environment
  # has required reviewers.
  release_gate:
    name: Release Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Validate dispatch approval
        env:
          REPOSITORY: ${{ github.repository }}
          CONFIRM: ${{ inputs.confirm }}
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_GATE_ENABLED: ${{ vars.RELEASE_GATE_ENABLED }}
        run: |
          set -euo pipefail

          if [ "${REPOSITORY}" != "pcguest/atb" ]; then
            echo "::error::Docker publication is only enabled for pcguest/atb; got ${REPOSITORY}."
            exit 1
          fi

          if [ "${CONFIRM}" != "PUBLISH" ]; then
            echo "::error::Confirmation input must be exactly PUBLISH; refusing to publish."
            exit 1
          fi

          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be stable SemVer (vMAJOR.MINOR.PATCH); got ${TAG}."
            exit 1
          fi

          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full 40-character lowercase hex commit SHA."
            exit 1
          fi

          if [ "${RELEASE_GATE_ENABLED}" != "true" ]; then
            echo "::error::Release gate closed: set repository variable RELEASE_GATE_ENABLED=true and configure the 'docker-release' environment with required reviewers."
            exit 1
          fi

      - name: Verify tag resolves to expected commit
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Tag ${TAG} resolves to ${ACTUAL_SHA}, not the expected commit ${EXPECTED_SHA}."
            exit 1
          fi
          echo "Release gate open for ${TAG} at ${ACTUAL_SHA}."

  # Layer E: unprivileged build validation. This job has no registry
  # credentials and never pushes. It builds a local image per platform so the
  # architecture, OCI label, and binary version checks run against exactly what
  # the tag produced. Publication rebuilds separately behind the protected
  # docker-release environment.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: release_gate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be stable SemVer (vMAJOR.MINOR.PATCH); got ${TAG}" >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ steps.release-tag.outputs.tag }}
          fetch-depth: 0

      - name: Validate tag and source version parity
        run: bash scripts/check-versions.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and verify local image
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          PLATFORM_SAFE="${PLATFORM//\//-}"
          LOCAL_TAG="atb-build:${PLATFORM_SAFE}"

          docker buildx build \
            --build-arg "ATB_VERSION=${TAG}" \
            --platform "${PLATFORM}" \
            --load \
            --tag "${LOCAL_TAG}" \
            .

          bash scripts/verify-container-architecture.sh "${LOCAL_TAG}" "${PLATFORM}"
          LABEL_VERSION=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
            "${LOCAL_TAG}")
          BINARY_VERSION=$(docker run --rm --platform "${PLATFORM}" \
            "${LOCAL_TAG}" version | awk '{print $NF}')
          if [ "${LABEL_VERSION}" != "${TAG}" ]; then
            echo "OCI version label ${LABEL_VERSION} does not match ${TAG}" >&2
            exit 1
          fi
          if [ "${BINARY_VERSION}" != "${TAG#v}" ]; then
            echo "atb binary version ${BINARY_VERSION} does not match ${TAG#v}" >&2
            exit 1
          fi

  publish:
    name: Publish multi-architecture image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, release_gate]
    environment: docker-release
    permissions:
      contents: read
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be stable SemVer (vMAJOR.MINOR.PATCH); got ${TAG}" >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ steps.release-tag.outputs.tag }}
          fetch-depth: 0

      - name: Revalidate tag and SHA before publication
        env:
          TAG: ${{ steps.release-tag.outputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full 40-character lowercase hex commit SHA."
            exit 1
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"

          if [ "${HEAD_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out HEAD ${HEAD_SHA} does not match expected ${EXPECTED_SHA}."
            exit 1
          fi
          if [ "${TAG_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Tag ${TAG} resolves to ${TAG_SHA}, not the expected commit ${EXPECTED_SHA}."
            exit 1
          fi
          echo "Publication source verified: ${TAG} at ${EXPECTED_SHA}."

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          logout: false
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push multi-architecture image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/atb"

          # Only immutable version tags are pushed here. Promoting :latest is a
          # separate, explicitly approved operation; it is never automatic.
          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            --build-arg "ATB_VERSION=${TAG}" \
            --tag "${IMAGE}:v${VERSION}" \
            --tag "${IMAGE}:v${MAJOR_MINOR}" \
            .

      - name: Verify published manifest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/atb"

          for REF in "${IMAGE}:v${VERSION}" "${IMAGE}:v${MAJOR_MINOR}"; do
            MANIFEST="$(docker buildx imagetools inspect "${REF}")"
            for PLATFORM in linux/amd64 linux/arm64; do
              if ! grep -Eq "Platform:[[:space:]]*${PLATFORM}" <<< "${MANIFEST}"; then
                echo "::error::Published manifest ${REF} is missing ${PLATFORM}." >&2
                exit 1
              fi
            done
            echo "Verified ${REF} contains linux/amd64 and linux/arm64."
          done
