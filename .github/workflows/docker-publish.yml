name: Docker Publish (Layer E)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.0-beta)"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Layer E: Docker image build and publication are an optional distribution channel.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          case "${TAG}" in
            v*.*.*) ;;
            *)
              echo "Release tag must match v*.*.*; got ${TAG}"
              exit 1
              ;;
          esac

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ steps.release-tag.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          logout: false
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push digest
        id: build
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/atb"
          PLATFORM_SAFE="${PLATFORM//\//-}"

          docker buildx build \
            --platform "${PLATFORM}" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "/tmp/meta-${PLATFORM_SAFE}.json" \
            .

          DIGEST=$(jq -r '."containerimage.digest"' "/tmp/meta-${PLATFORM_SAFE}.json")
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/meta-*.json
          if-no-files-found: error

  merge:
    name: Merge manifests and push tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          case "${TAG}" in
            v*.*.*) ;;
            *)
              echo "Release tag must match v*.*.*; got ${TAG}"
              exit 1
              ;;
          esac

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          logout: false
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create and push manifest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1,2)"
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/atb"
          DIGESTS=$(jq -r '."containerimage.digest"' /tmp/digests/*.json | \
            awk -v img="${IMAGE}" '{print img"@"$1}')

          docker buildx imagetools create \
            -t "${IMAGE}:v${VERSION}" \
            -t "${IMAGE}:v${MAJOR_MINOR}" \
            -t "${IMAGE}:latest" \
            ${DIGESTS}
