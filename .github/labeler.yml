go:
  - changed-files:
      - any-glob-to-any-file: ['cmd/**', 'internal/**', 'go.mod', 'go.sum']

python:
  - changed-files:
      - any-glob-to-any-file: ['sdk/python/**']

typescript:
  - changed-files:
      - any-glob-to-any-file: ['sdk/typescript/**']

web:
  - changed-files:
      - any-glob-to-any-file: ['web/**']

docs:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', 'README.md', 'LAUNCH.md', 'HN_POST.md']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']
