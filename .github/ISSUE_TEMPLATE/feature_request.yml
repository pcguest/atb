name: Feature Request
description: Suggest a new feature or enhancement for ATB.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ATB is focused on local-first audit trails for privacy-sensitive AI systems.
        Requests tied to incident review, customer handoff, or internal audit are easier to evaluate.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of ATB would this feature affect?
      options:
        - Go CLI
        - Python SDK
        - TypeScript SDK
        - Local viewer / dashboard
        - Documentation
        - New Integration
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What concrete workflow is blocked today, and what is the current limitation?
    validations:
      required: true

  - type: dropdown
    id: workflow
    attributes:
      label: Primary Workflow
      description: Which buyer or operator workflow does this request support?
      options:
        - Incident review
        - Customer handoff
        - Internal audit or privacy review
        - Other
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you want and why the current repo shape is insufficient.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Removes a current blocker
        - Material improvement
        - Exploratory
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ATB Version
      description: Output of `atb version` (CLI) or SDK version.
      placeholder: "e.g. atb 1.8.1 or atb-sdk 1.8.1"
    validations:
      required: true

  - type: checkboxes
    id: trace_bundle_attached
    attributes:
      label: Trace Bundle Attached?
      description: Attach a trace if this request is based on a concrete run.
      options:
        - label: I attached an ATB trace bundle (or sanitized excerpt).
          required: false
