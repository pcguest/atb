name: Feature Request
description: Suggest a new feature or enhancement for ATB.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for your feature suggestion! Please provide as much context as possible.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of ATB would this feature affect?
      options:
        - CLI (Go)
        - Python SDK
        - TypeScript SDK
        - Web Platform
        - Documentation
        - New Integration
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What is the current limitation?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you would like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocker
        - Nice-to-have
        - Question
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ATB Version
      description: Output of `atb version` (CLI) or SDK version.
      placeholder: "e.g. v0.1.0 (`atb version`)"
    validations:
      required: true

  - type: checkboxes
    id: trace_bundle_attached
    attributes:
      label: Trace Bundle Attached?
      description: Attach a trace if this request is based on a concrete run.
      options:
        - label: I attached an ATB trace bundle (or sanitized excerpt).
          required: false
