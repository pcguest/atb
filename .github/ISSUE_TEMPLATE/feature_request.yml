name: Feature Request
description: Suggest a new feature or enhancement for ATB.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for your feature suggestion! Please provide as much context as possible.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of ATB would this feature affect?
      options:
        - CLI (Go)
        - Python SDK
        - TypeScript SDK
        - Web Platform
        - Documentation
        - New Integration
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What is the current limitation?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you would like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low — Nice to have
        - Medium — Would significantly improve my workflow
        - High — Blocking my use case
    validations:
      required: true
