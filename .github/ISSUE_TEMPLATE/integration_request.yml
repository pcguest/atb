name: Integration Request
description: Request a new integration with an AI framework, tool, or platform.
title: "[Integration]: "
labels: ["integration", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Request a concrete integration that would help ATB record, review, or hand off AI workflow evidence.
        Please describe the workflow, not just the framework name.

  - type: input
    id: framework
    attributes:
      label: Framework / Tool / Platform
      description: Name of the framework or tool you want ATB to integrate with.
      placeholder: "e.g. LangChain, LlamaIndex, CrewAI, AutoGen, Haystack"
    validations:
      required: true

  - type: input
    id: framework_url
    attributes:
      label: Framework URL
      placeholder: "https://github.com/..."
    validations:
      required: false

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: What workflow should this integration support, and what evidence should ATB capture?
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example Usage
      description: Show how you would ideally use ATB with this framework.
      render: python
    validations:
      required: false

  - type: dropdown
    id: sdk
    attributes:
      label: SDK
      description: Which shipped SDK path should this integration target?
      options:
        - Python SDK
        - TypeScript SDK
        - Both
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Removes a current blocker
        - Material improvement
        - Exploratory
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ATB Version
      description: Output of `atb version` (CLI) or SDK version.
      placeholder: "e.g. atb v0.9.0-beta or @pcguest/atb-sdk 0.9.0-beta.1"
    validations:
      required: true

  - type: checkboxes
    id: trace_bundle_attached
    attributes:
      label: Trace Bundle Attached?
      options:
        - label: I attached an ATB trace bundle (or sanitized excerpt).
          required: false
