name: Bug Report
description: Report a bug in the Go CLI, SDKs, local viewer, or docs.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of ATB is affected?
      options:
        - Go CLI
        - Python SDK
        - TypeScript SDK
        - Local viewer / dashboard
        - Documentation
        - CI/CD
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ATB Version
      description: Output of `atb version` (CLI) or SDK version.
      placeholder: "e.g. atb 1.1.0 or atb-sdk 1.1.0"
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How severe is this issue for your workflow?
      options:
        - Blocks current work
        - Degrades review or handoff
        - Cosmetic or docs only
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue. Include the exact command or SDK call when possible.
      placeholder: |
        1. Run `atb init`
        2. Run `atb append ...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include error messages and stack traces.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and any runtime versions involved.
      placeholder: |
        OS: macOS 14 (Apple Silicon)
        Go: 1.22.4
        Python: 3.11.0
    validations:
      required: false

  - type: checkboxes
    id: trace_bundle_attached
    attributes:
      label: Bundle Evidence Attached?
      description: Attach a redacted `.atb` bundle or sanitized excerpt if it helps reproduce the issue.
      options:
        - label: I attached an ATB trace bundle (or sanitized excerpt) that reproduces this issue.
          required: false
