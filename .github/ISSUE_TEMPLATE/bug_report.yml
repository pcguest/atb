name: Bug Report
description: Report a bug in the ATB CLI, SDK, or web platform.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of ATB is affected?
      options:
        - CLI (Go)
        - Python SDK
        - TypeScript SDK
        - Web Platform
        - Documentation
        - CI/CD
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ATB Version
      description: Output of `atb version` or SDK version.
      placeholder: "e.g. v0.1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Run `atb init`
        2. Run `atb append ...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include error messages and stack traces.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go/Python/Node version.
      placeholder: |
        OS: macOS 14 (Apple Silicon)
        Go: 1.22.4
        Python: 3.11.0
    validations:
      required: false
